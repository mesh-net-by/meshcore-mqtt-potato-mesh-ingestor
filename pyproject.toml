[project]
name = "meshcore-potato-ingestor"
version = "0.1.0"
description = "MeshCore MQTT → potato-mesh ingestor"
requires-python = ">=3.11"
dependencies = [
    "aiomqtt>=2.3.0",
    "httpx>=0.27.0",
    "meshcoredecoder>=0.1.0",
    "pycryptodome>=3.20.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.4.0",
]

[project.scripts]
ingestor = "ingestor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestor"]

[tool.ruff]
line-length = 100
target-version = "py311"
