services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-u", "${MQTT_USERNAME}", "-P", "${MQTT_PASSWORD}", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ingestor:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      mosquitto:
        condition: service_healthy
    deploy:
      replicas: ${INGESTOR_REPLICAS:-1}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
