listener 1883
protocol mqtt

# MQTT 5.0 for shared subscriptions
# (Mosquitto 2.x supports both 3.1.1 and 5.0 automatically)

# Authentication required
allow_anonymous false
password_file /mosquitto/config/passwd

# Persistence — retain messages survive broker restart
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Limit message queue to prevent memory exhaustion on slow consumers
max_queued_messages 1000

# Note: retained message cleanup is handled by the ingestor itself —
# after processing each retained message it publishes an empty payload
# with retain=true, which removes it from the broker.
